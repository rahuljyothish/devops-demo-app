name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: app
        run: mvn test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        working-directory: app
        run: mvn package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: app/target/devops-demo-app-*.jar

  deploy:
    name: Deploy to BTP Cloud Foundry
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app/target

      - name: Install CF CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update -qq && sudo apt-get install -y cf8-cli
          cf --version

      - name: Deploy to BTP CF
        env:
          CF_API: ${{ secrets.CF_API }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
          CF_REFRESH_TOKEN: ${{ secrets.CF_REFRESH_TOKEN }}
          CF_UAA_URL: ${{ secrets.CF_UAA_URL }}
          CF_AUTH_URL: ${{ secrets.CF_AUTH_URL }}
          CF_DOPPLER_URL: ${{ secrets.CF_DOPPLER_URL }}
          CF_LOG_CACHE_URL: ${{ secrets.CF_LOG_CACHE_URL }}
          CF_UAA_ENDPOINT: ${{ secrets.CF_UAA_ENDPOINT }}
        run: |
          TOKEN_RESPONSE=$(curl -s -X POST "${CF_UAA_URL}/oauth/token" -H "Content-Type: application/x-www-form-urlencoded" -u "cf:" -d "grant_type=refresh_token&refresh_token=${CF_REFRESH_TOKEN}")
          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")
          if [ -z "$ACCESS_TOKEN" ]; then echo "Token exchange failed: $TOKEN_RESPONSE"; exit 1; fi
          mkdir -p ~/.cf
          export ACCESS_TOKEN
          python3 -c "import json,os; config={'ConfigVersion':4,'Target':os.environ['CF_API'],'APIVersion':'3.225.0','AuthorizationEndpoint':os.environ['CF_AUTH_URL'],'DopplerEndPoint':os.environ['CF_DOPPLER_URL'],'UaaEndpoint':os.environ['CF_UAA_ENDPOINT'],'LogCacheEndPoint':os.environ['CF_LOG_CACHE_URL'],'AccessToken':'bearer '+os.environ['ACCESS_TOKEN'],'RefreshToken':os.environ['CF_REFRESH_TOKEN'],'OrganizationFields':{'GUID':'','Name':os.environ['CF_ORG']},'SpaceFields':{'GUID':'','Name':os.environ['CF_SPACE'],'AllowSSH':True},'SSHOAuthClient':'ssh-proxy','UAAOAuthClient':'cf','UAAOAuthClientSecret':'','CFOnK8s':{'Enabled':False,'AuthInfo':''},'SSLDisabled':False}; open(os.path.expanduser('~/.cf/config.json'),'w').write(json.dumps(config,indent=2))"
          cf target -o "$CF_ORG" -s "$CF_SPACE"
          cf push -f manifest.yml
          cf logout
